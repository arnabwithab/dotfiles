conky.config = {
    alignment = 'top_right',
    xinerama_head = 1,
    gap_x = 30,
    gap_y = 50,
    minimum_width = 280,
    maximum_width = 320,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 200,
    own_window_colour = '0a0a0a',

    border_inner_margin = 10,
    border_outer_margin = 0,
    border_width = 2,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    xftalpha = 1,

    default_color = 'bbc2cf',
    color1 = '5f27cd',
    color2 = 'c57bdb',
    color3 = '4db5bd',
    color4 = '7bc275',

    draw_outline = false,
    draw_shades = false,

    double_buffer = true,
    no_buffers = true,

    update_interval = 1,
};

conky.text = [[
${color1}┌─ ${color2}CLOCK ${color1}──────────────────────────────┐
${color1}│${color}
${color1}│    ${color}${font DejaVu Sans Mono:size=28}${time %H:%M}${font}
${color1}│    ${color}${time %A, %d %B %Y}
${color1}│
${color1}├─ ${color2}WEATHER ${color1}───────────────────────────┤
${color1}│${color}
${color1}│    ${color}${execi 1800 curl -s "wttr.in/?format=%C+%t"}
${color1}│
${color1}├─ ${color2}MUSIC ${color1}─────────────────────────────┤
${color1}│${color}
${color1}│    ${color3}♫ ${color}${exec playerctl metadata --format "{{ artist }} — {{ title }}" 2>/dev/null}
${color1}│
${color1}└──────────────────────────────────────────┘
]];
